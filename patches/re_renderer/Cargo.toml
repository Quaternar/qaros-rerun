[package]
edition = "2024"
rust-version = "1.96"
name = "re_renderer"
version = "0.40.0"
authors = ["rerun.io <opensource@rerun.io>"]
build = "build.rs"
include = [
    "../../Cargo.lock",
    "../../LICENSE-APACHE",
    "../../LICENSE-MIT",
    "**/*.rs",
    "Cargo.toml",
    "shader/**/*.wgsl",
]
publish = true
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A wgpu based renderer for all your visualization needs."
homepage = "https://rerun.io"
readme = "README.md"
license = "MIT OR Apache-2.0"
repository = "https://github.com/rerun-io/rerun"
resolver = "2"

[package.metadata.docs.rs]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "wasm32-unknown-unknown",
]

[package.metadata.cargo-shear]
ignored = [
    "profiling",
    "getrandom",
]

[features]
default = [
    "import-dae",
    "import-gltf",
    "import-obj",
    "import-ply",
    "import-stl",
]
import-dae = ["dep:dae-parser"]
import-gltf = ["dep:gltf"]
import-obj = ["dep:tobj"]
import-ply = ["dep:ply-rs-bw"]
import-stl = ["dep:stl_io"]

[lib]
name = "re_renderer"
path = "src/lib.rs"
bench = false

[[test]]
name = "shader_validation"
path = "tests/shader_validation.rs"

[[bench]]
name = "bench_bounding_box"
path = "benches/bench_bounding_box.rs"
harness = false

[[bench]]
name = "bench_voxel_grid_draw_data"
path = "benches/bench_voxel_grid_draw_data.rs"
harness = false

