[package]
name = "qaros-sink"
description = "FrameSink over the QAROS CPU render sender, a GpuFrameSink over its Vulkan render sender, plus Rerun's 2D views as QAROS GUI panels."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# The Vulkan render sender: frames rendered on the viewer's own Vulkan device.
vulkan = ["dep:vulkan-device", "dep:wgpu", "frame-sink/gpu", "qaros/vulkan"]
# The end-to-end test against the real QAROS package (QAROS_PACKAGE_BIN) and the release
# viewer; off by default.
e2e = []
# `stub_control`: qaros-stub's control exports for other crates' tests.
stub-control = ["dep:libloading"]

[dependencies]
frame-sink.workspace = true
xr-math.workspace = true
qaros.workspace = true
glam.workspace = true
log = "0.4"
vulkan-device = { workspace = true, optional = true }
wgpu = { workspace = true, optional = true }
libloading = { version = "0.8", optional = true }

[dev-dependencies]
qaros-stub.workspace = true
qaros-ext.workspace = true
libloading = "0.8"
pollster = "0.4"
ash = "0.38"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Media", "Win32_System_Console", "Win32_System_Threading"] }

# The workspace forbids unsafe code; this crate denies it instead, for its calls across the
# FFI boundary: loading the QAROS library and starting Vulkan render senders
# (`connection.rs`), the Vulkan sender's raw image, semaphore and device-wait calls
# (`vulkan/`), the Windows process and GPU scheduling calls (`host_timing.rs`), and the C
# runtime flush and process termination at exit (`process_exit.rs`), and the console control
# handler that turns Ctrl+C into a Stop (`console_stop.rs`). Its stub test opens the
# stub's control exports.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
