[package]
name = "vulkan-device"
description = "An app-created Vulkan device for the viewer: physical device picked from the VkInstance, extra device extensions, raw handles, external VkImage wrapping and semaphore staging."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
# `vulkan-portability` is what enables wgpu's Vulkan backend on Apple platforms (MoltenVK).
wgpu = { workspace = true, features = ["vulkan", "vulkan-portability"] }
# The version wgpu-hal 30 uses, so its Vulkan handles are this crate's types.
ash = "0.38"
log = "0.4"

[dev-dependencies]
pollster = "0.4"

# The workspace forbids unsafe code; wgpu-hal's Vulkan escape hatches and raw ash calls cannot
# avoid it, so this crate denies it and allows it per function, each with its safety contract.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
unwrap_used = "warn"
expect_used = "warn"
