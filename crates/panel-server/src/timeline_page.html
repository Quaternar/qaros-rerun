<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>timeline</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
            background: #161616;
        }

        #scrubber {
            position: absolute;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        #track {
            position: absolute;
            left: 0;
            right: 20%;
            top: 0;
            bottom: 0;
        }

        #rail {
            position: absolute;
            left: 0;
            right: 0;
            top: 50%;
            height: 8%;
            min-height: 6px;
            margin-top: -3px;
            border-radius: 4px;
            background: #5a5a5a;
        }

        #thumb {
            position: absolute;
            left: 0;
            top: 0;
            width: 6%;
            min-width: 24px;
            height: 100%;
            transform: translateX(-50%);
            border-radius: 0;
            background: #e8e8e8;
        }

        #play {
            position: absolute;
            right: 0;
            top: 0;
            width: 20%;
            height: 100%;
            background: #2f6fdb;
            color: #fff;
            font: bold 18px system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    </style>
</head>
<body>
    <div id="scrubber">
        <div id="track">
            <div id="rail"></div>
            <div id="thumb"></div>
        </div>
        <div id="play">Play</div>
    </div>
    <script>
        // The timeline slider. A drag on the track pauses the viewer and moves its time cursor
        // there, a tap on Play resumes playback. The thumb follows the viewer's time cursor,
        // during playback and when the desktop time bar moves: the page polls an image whose
        // width encodes the cursor, since an image's size is what the page can read without
        // script-side HTTP. Under the finger, and for a moment after the last seek while the
        // viewer catches up, polled positions are ignored so the thumb does not jump back.
        // QAROS hands a finger on the panel to the page as mouse input in its Ultralight panels
        // and as touch input in its CEF panels, so both are taken; a touch handler cancels the
        // mouse events a browser would make up from the same touch. Requests to the viewer are
        // plain image loads, which the embedded browsers of QAROS GUI panels all support, and
        // the moves of a drag are thinned to one request per interval, with the last position
        // of a drag always sent.
        var timelineUrl = "${TIMELINE_URL}";
        var positionUrl = "${POSITION_URL}";
        var seekInterval = 80;
        var positionInterval = 250;
        var positionHoldAfterSeek = 1000;
        var positionSteps = 1000;
        var pageToken = String(new Date().getTime());
        var trackElement = document.getElementById("track");
        var thumbElement = document.getElementById("thumb");
        var playElement = document.getElementById("play");
        var isScrubbing = false;
        var unsentFraction = null;
        var lastSeekTime = 0;
        var lastThumbMoveTime = 0;
        var isSeekScheduled = false;
        var timelineRequestNumber = 0;
        var lastTimelineRequest = null;
        var positionRequestNumber = 0;
        var latestPositionProbe = null;

        function sendTimelineRequest(query) {
            timelineRequestNumber += 1;
            lastTimelineRequest = new Image();
            lastTimelineRequest.src =
                timelineUrl + "?" + query + "&n=" + pageToken + "-t" + timelineRequestNumber;
        }

        function showThumbAt(fraction) {
            thumbElement.style.left = (fraction * 100).toFixed(2) + "%";
        }

        function isThumbHeldByUser() {
            return isScrubbing || new Date().getTime() - lastThumbMoveTime < positionHoldAfterSeek;
        }

        function showPolledPosition(probe) {
            if (probe !== latestPositionProbe || isThumbHeldByUser() || probe.naturalWidth < 1) {
                return;
            }
            showThumbAt(Math.min((probe.naturalWidth - 1) / positionSteps, 1));
        }

        function pollPosition() {
            setTimeout(pollPosition, positionInterval);
            positionRequestNumber += 1;
            var probe = new Image();
            probe.onload = function () {
                showPolledPosition(probe);
            };
            latestPositionProbe = probe;
            probe.src = positionUrl + "?n=" + pageToken + "-p" + positionRequestNumber;
        }

        function fractionAt(clientX) {
            var bounds = trackElement.getBoundingClientRect();
            if (bounds.width <= 0) {
                return 0;
            }
            return Math.min(Math.max((clientX - bounds.left) / bounds.width, 0), 1);
        }

        function sendUnsentSeek() {
            isSeekScheduled = false;
            if (unsentFraction === null) {
                return;
            }
            lastSeekTime = new Date().getTime();
            sendTimelineRequest("at=" + unsentFraction.toFixed(4));
            unsentFraction = null;
        }

        function seekTo(clientX, isLastOfDrag) {
            var fraction = fractionAt(clientX);
            showThumbAt(fraction);
            lastThumbMoveTime = new Date().getTime();
            unsentFraction = fraction;
            var sinceLastSeek = new Date().getTime() - lastSeekTime;
            if (isLastOfDrag || sinceLastSeek >= seekInterval) {
                sendUnsentSeek();
            } else if (!isSeekScheduled) {
                isSeekScheduled = true;
                setTimeout(sendUnsentSeek, seekInterval - sinceLastSeek);
            }
        }

        function startScrub(clientX) {
            isScrubbing = true;
            seekTo(clientX, false);
        }

        function moveScrub(clientX) {
            if (isScrubbing) {
                seekTo(clientX, false);
            }
        }

        function endScrub(clientX) {
            if (isScrubbing) {
                isScrubbing = false;
                seekTo(clientX, true);
            }
        }

        function resumePlayback() {
            isScrubbing = false;
            unsentFraction = null;
            sendTimelineRequest("play");
        }

        function firstTouchX(event) {
            return event.changedTouches[0].clientX;
        }

        trackElement.addEventListener("mousedown", function (event) {
            event.preventDefault();
            startScrub(event.clientX);
        });
        document.addEventListener("mousemove", function (event) {
            moveScrub(event.clientX);
        });
        document.addEventListener("mouseup", function (event) {
            endScrub(event.clientX);
        });
        trackElement.addEventListener("touchstart", function (event) {
            event.preventDefault();
            startScrub(firstTouchX(event));
        }, { passive: false });
        document.addEventListener("touchmove", function (event) {
            if (isScrubbing) {
                event.preventDefault();
                moveScrub(firstTouchX(event));
            }
        }, { passive: false });
        document.addEventListener("touchend", function (event) {
            endScrub(firstTouchX(event));
        });
        document.addEventListener("touchcancel", function (event) {
            endScrub(firstTouchX(event));
        });
        playElement.addEventListener("click", resumePlayback);
        pollPosition();
    </script>
</body>
</html>
